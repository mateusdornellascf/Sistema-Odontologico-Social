<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente IA</title>
    <link rel="stylesheet" href="style.css?v=3">
    <script src="layout.js?v=1" defer></script>
</head>
<body>

    <div class="container chat-page">
        <section class="chat-conversation">
            <span class="assistant-tag">Assistente inteligente</span>
            <h1>Olá, eu sou o Gemini!</h1>
            <p>Como posso ajudar com o Sistema Odontológico Social hoje?</p>
            <div id="resposta" class="resposta" aria-live="polite"></div>
        </section>

        <section class="composer">
            <p class="suggestions-label">Experimente uma pergunta</p>
            <div id="sugestoes" class="sugestoes"></div>

            <div class="chat-box">
                <textarea
                    id="pergunta"
                    rows="1"
                    placeholder="Pergunte alguma coisa"
                ></textarea>

                <button class="chat-button" onclick="enviarPergunta()">
                    Enviar
                </button>
            </div>
        </section>
    </div>

    <script src="chat.js?v=2"></script>
</body>
</html>
